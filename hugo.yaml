baseURL: 'https://aguirrejuan.github.io/'
languageCode: en-us
title: Juan's Blog
theme: PaperMod

params:
  env: production
  title: Juan's Blog
  description: >-
      Hi, I'm Juan. I am excited to share meaningful ideas about my daily life
      and articulate my knowledge through this blog. Join me on this journey as
      I explore various aspects of my life and offer insights into my
      experiences.

  author: Juan Carlos Aguirre Arango


  homeInfoParams:
    Title: Welcome to Juan's Blog
    Content: >-
      Hi, I'm Juan. I am excited to share meaningful ideas about my daily life
      and articulate my knowledge through this blog. Join me on this journey as
      I explore various aspects of my life and offer insights into my
      experiences.


  socialIcons:
    - name: github
      title: GitHub
      url: 'https://github.com/aguirrejuan'
    - name: twitter
      url: "https://twitter.com/aaguirrejuan"
  


  ShowReadingTime: true
  ShowToc: true
  ShowShareButtons: true
  ShowWordCount: true
  

